<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 图标由 `node scripts/make-favicon.mjs` 从 public/欢迎页.png 等比缩来，用整张图不裁。
         代价是 16/32px 那两档只剩一团深色轮廓，而且白底方块在深色标签栏上会露出来；
         裁中间那颗球试过了，那球是接近纯黑的实心球，缩完就是个黑点，更糟。
         .ico 里塞了 16~256 六档，Windows 任务栏和老浏览器认它；PNG 给现代浏览器挑。 -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 标题 Source Serif 4（带 opsz 光学尺寸轴：72px 的 H1 自动拿 display 切割）
         正文 Inter。两个都取 400~600 的可变切片，display=swap + 系统字体兜底，
         字体没下来也不白屏。中文两个都没有字形，会回落系统 CJK。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&family=Source+Serif+4:opsz,wght@8..60,400..600&display=swap"
      rel="stylesheet"
    />
    <title>Uranus · 控制台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
